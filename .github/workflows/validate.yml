name: Validate README

on:
  push:
    branches: [main, master]
    paths: ["README.md", "scripts/**"]
  pull_request:
    paths: ["README.md", "scripts/**"]

jobs:
  format:
    name: Format check
    runs-on: ubuntu-latest
    # Some inherited entries do not yet satisfy every rule, so this reports
    # problems without blocking. Remove the next line once the list is clean.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Validate README format
        run: python scripts/validate/format.py README.md

  duplicates:
    name: Duplicate links
    runs-on: ubuntu-latest
    # A few inherited duplicates exist; reported, not blocking.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Check duplicate links
        run: python scripts/validate/links.py README.md --only_duplicate_links_checker
