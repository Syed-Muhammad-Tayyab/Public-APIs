<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Public APIs - Developed by Syed Muhammad Tayyab">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.5" stop-color="#1b1464"/>
      <stop offset="1" stop-color="#0f766e"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 .5 .5" to="360 .5 .5" dur="30s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="24" fill="url(#grid)"/>

  <!-- floating API nodes -->
  <g fill="none" stroke="#22d3ee" stroke-opacity="0.35" stroke-width="1.5">
    <path d="M90 70 L220 140 L170 260 L90 70"/>
    <path d="M1090 60 L1190 150 L1110 270 L1090 60"/>
    <path d="M220 140 L1090 60" stroke-opacity="0.12"/>
    <path d="M170 260 L1110 270" stroke-opacity="0.12"/>
  </g>
  <g fill="#22d3ee">
    <circle cx="90" cy="70" r="7"><animate attributeName="opacity" values="1;.3;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="220" cy="140" r="6"><animate attributeName="opacity" values=".3;1;.3" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="170" cy="260" r="7"><animate attributeName="opacity" values="1;.4;1" dur="5s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="#34d399">
    <circle cx="1090" cy="60" r="7"><animate attributeName="opacity" values=".4;1;.4" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="1190" cy="150" r="6"><animate attributeName="opacity" values="1;.3;1" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="1110" cy="270" r="7"><animate attributeName="opacity" values=".3;1;.3" dur="3s" repeatCount="indefinite"/></circle>
  </g>

  <!-- braces icon -->
  <text x="640" y="92" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="54" fill="#a5f3fc" fill-opacity="0.9">{ &#8226; API &#8226; }</text>

  <!-- title -->
  <text x="640" y="188" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="92" font-weight="800" fill="url(#title)" filter="url(#glow)" letter-spacing="2">PUBLIC APIs</text>

  <!-- subtitle -->
  <text x="640" y="236" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" fill="#e2e8f0">A curated list of free APIs for software and web development</text>

  <!-- developer credit pill -->
  <rect x="380" y="272" width="520" height="52" rx="26" fill="#ffffff" fill-opacity="0.08" stroke="#22d3ee" stroke-opacity="0.6"/>
  <text x="640" y="304" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="25" font-weight="600" fill="#ffffff">Developed by Syed Muhammad Tayyab</text>

  <!-- scan line -->
  <rect x="0" y="0" width="1280" height="3" fill="#22d3ee" fill-opacity="0.35">
    <animate attributeName="y" values="0;357;0" dur="9s" repeatCount="indefinite"/>
  </rect>
</svg>
